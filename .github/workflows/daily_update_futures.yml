name: Daily Update Futures Data

on:
  schedule:
    - cron: '0 9 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai  # 👈 这样设置后，该 Job 下的所有步骤都会生效
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn' # 开启缓存，加快后续运行速度
          cache-dependency-path: server/yarn.lock

      - name: Install dependencies
        run: |
          cd server
          npm install

      - name: Run Script
        run: node server/schedule/index.js

      - name: Commit and Push Data
        run: |
          git config --global user.name "pureStyles"
          git config --global user.email "siyuan.wen@outlook.com"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update dayily data" && git push)