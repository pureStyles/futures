name: Daily Update Futures Data

on:
  schedule:
    - cron: '50 9 * * 1-5'
  workflow_dispatch:
    inputs:
      update_mode:
        description: 运行模式
        required: true
        default: daily
        type: choice
        options:
          - daily
          - backfill
      backfill_start_date:
        description: 补数开始日期（可留空，自动从首个缺失交易日开始）
        required: false
        type: string
      backfill_end_date:
        description: 补数结束日期（可留空，默认今天）
        required: false
        type: string

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai  # 👈 这样设置后，该 Job 下的所有步骤都会生效
      PUSH_TOKEN: ${{ secrets.MY_GITHUB_TOKEN != '' && secrets.MY_GITHUB_TOKEN || github.token }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn' # 开启缓存，加快后续运行速度
          cache-dependency-path: server/yarn.lock

      - name: Install dependencies
        run: |
          cd server
          npm install

      - name: Run Script
        env:
          USER_COOKIE: ${{ vars.USER_COOKIE }}
          UPDATE_MODE: ${{ github.event.inputs.update_mode }}
          BACKFILL_START_DATE: ${{ github.event.inputs.backfill_start_date }}
          BACKFILL_END_DATE: ${{ github.event.inputs.backfill_end_date }}
        run: node server/schedule/index.js

      - name: Commit and Push Data
        run: |
          git config user.name "pureStyles"
          git config user.email "siyuan.wen@outlook.com"
          git add .
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          if [ "${UPDATE_MODE}" = "backfill" ]; then
            git commit -m "Backfill futures data"
          else
            git commit -m "Update daily data"
          fi
          git push "https://x-access-token:${PUSH_TOKEN}@github.com/${{ github.repository }}.git" "HEAD:${{ github.ref_name }}"
        env:
          UPDATE_MODE: ${{ github.event.inputs.update_mode }}
